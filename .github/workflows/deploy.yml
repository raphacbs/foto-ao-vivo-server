name: Deploy Backend Node.js para Produção

on:
  push:
    branches: 
      - main # Roda automaticamente ao atualizar a branch main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: raphacbs/node-backend 

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem Docker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Atualizar Manifesto K8s (GitOps)
        run: |
          # Substitui a tag "latest" ou qualquer outra pela nova tag baseada no commit
          sed -i "s|image: ghcr.io/raphacbs/node-backend:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/app-node.yaml
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Adiciona e commita o arquivo YAML atualizado
          git add k8s/app-node.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza imagem node para ${{ github.sha }}" && git push)